<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="description" content="Professioneller Immobilien-Investmentcheck für vermietete Wohnimmobilien in Deutschland."><title>Immobilien-Investmentcheck V4</title><link rel="stylesheet" href="style.css"></head><body><main class="w" id="app"><div class="card"><b>Immobilien-Investmentcheck wird geladen…</b></div></main><script>(async()=>{const app=document.getElementById('app');try{const files=['part1.html','part2.html','part3.html','part4.html'];const html=(await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})))).join('');app.innerHTML=html;for(const f of ['app-core.js','app-model.js','app-results-helpers.js','app-results-calc.js','app-ui.js'])await new Promise((ok,bad)=>{const s=document.createElement('script');s.src=f;s.onload=ok;s.onerror=bad;document.body.appendChild(s)})}catch(e){app.innerHTML='<div class="card"><h2>Ladefehler</h2><p>Die App konnte nicht vollständig geladen werden. Bitte Seite neu laden.</p></div>';console.error(e)}})();</script></body></html>
